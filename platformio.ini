; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = T5-ePaper-S3

; LilyGo-EPD47 が配っているボード定義をリポジトリに取り込んで使う。
; PlatformIO の公式ボードには T5 4.7 の S3 版が無い。
boards_dir = boards

; 実機向け env の共通設定。
; 基板の違い（タッチの有無やピンの本数）は実行時に見分けるので、
; env は 1 つで足りる。
[device]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
upload_speed = 921600
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
	-std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
	; 電子ペーパー（ED047TC1）のドライバ。タッチ用の SensorLib もここから入る。
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#v1.1.0
	lewisxhe/SensorLib@0.3.1
	lennarthennigs/Button2@2.3.2
	; 画像のデコード。M5GFX のような描画ライブラリを使わないので自前で持つ。
	bitbank2/JPEGDEC@^1.8.2
	bitbank2/PNGdec@^1.1.3
	; WiFi の接続用 QR コード
	ricmoo/QRCode@^0.0.1

; LilyGo T5 4.7 inch e-Paper S3
; H716（タッチ付き）/ H578 / H580（タッチ無し）のいずれでも動く。
; https://lilygo.cc/en-us/products/t5-4-7-inch-e-paper-v2-3
[env:T5-ePaper-S3]
extends = device
board = T5-ePaper-S3
build_flags =
	${device.build_flags}
	-DLILYGO_T5_EPD47_S3

; テスト用の環境。
; この環境では Arduino.h や EPD 系は使えないが、純粋な関数ロジックの試験に使う。
[env:native]
platform = native
build_flags = -std=c++17
